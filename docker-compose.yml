version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skillpulse_postgres
    restart: always
    environment:
      POSTGRES_DB: skillpulse_db
      POSTGRES_USER: skillpulse_user
      POSTGRES_PASSWORD: skillpulse_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpulse_user -d skillpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillpulse_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skillpulse_user:skillpulse_password_2026@db:5432/skillpulse_db
      JWT_SECRET: ${JWT_SECRET:-skillpulse-production-secure-jwt-secret-key-2026}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillpulse_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
